<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}MeroPredict | NEPSE Analysis & Prediction{% endblock %}</title>
   
    
    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Main CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- Toast CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/toast.css') }}"
    >


    <!-- Page-specific CSS -->
    {% block extra_css %}
    {% endblock %}


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


    <!-- ========== TOAST NOTIFICATIONS ========== -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="toast-container" id="toastContainer">
                {% for category, message in messages %}
                    <div class="toast-item toast-{{ category }}">
                        <i class="bi {{ 'bi-check-circle-fill' if category == 'success' else 'bi-exclamation-circle-fill' }}"></i>
                        <span>{{ message }}</span>
                        <button class="toast-close" onclick="this.parentElement.remove()">
                            <i class="bi bi-x"></i>
                        </button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}


    <!-- PAGE CONTENT -->

    {% block content %}
    {% endblock %}


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Theme toggle -->
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>


    <!-- Toast auto-dismiss -->
    <script src="{{ url_for('static', filename='js/toast.js') }}"></script>


    <!-- PAGE-SPECIFIC JAVASCRIPT -->

    {% block scripts %}
    {% endblock %}

</body>

</html>
