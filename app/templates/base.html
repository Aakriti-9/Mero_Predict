<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MeroPredict | NEPSE Analysis & Prediction</title>


    <!-- Bootstrap 5 -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Custom CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- Chart.js -->

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar navbar-expand-lg navbar-dark main-navbar">

        <div class="container-fluid px-4 px-lg-5">

            <!-- Logo -->

            <a class="navbar-brand d-flex align-items-center" href="/">

                <div class="logo-box">

                    <i class="bi bi-activity"></i>

                </div>

                <span class="logo-text">

                    <span class="logo-white">Mero</span><span class="logo-teal">Predict</span>

                </span>

            </a>


            <!-- Mobile button -->

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar"
            >

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- Navigation -->

            <div class="collapse navbar-collapse" id="mainNavbar">

                <div class="navbar-nav ms-auto align-items-lg-center gap-lg-4">

                    <a class="nav-link dashboard-link" href="{{ url_for('login') }}">
                        Dashboard
                    </a>

                    <a class="get-started-btn" href="{{ url_for('login') }}">
                        Get Started
                    </a>

                </div>

            </div>

        </div>

    </nav>


    <!-- ================= PAGE CONTENT ================= -->

    {% block content %}
    {% endblock %}


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="container text-center">

            <p>
                © 2026 Mero-Predict — NEPSE Stock Analysis Platform.
                Data for educational purposes only. Not financial advice.
            </p>

        </div>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>


    <!-- Page-specific JavaScript -->

    {% block scripts %}
    {% endblock %}

</body>

</html>
