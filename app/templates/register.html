<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Mero-Predict</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >


    <!-- Register CSS -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/register.css') }}"
    >

</head>


<body>


<main class="register-page">


    <div class="register-wrapper">


        <!-- ================= LOGO ================= -->

        <a
            href="{{ url_for('home') }}"
            class="brand"
        >

            <div class="brand-icon">

                <i class="bi bi-graph-up-arrow"></i>

            </div>


            <div class="brand-name">

                <span>Mero</span><strong>Predict</strong>

            </div>

        </a>



        <!-- ================= REGISTER CARD ================= -->

        <div class="register-card">


            <div class="register-header">


                <div class="welcome-icon">

                    <i class="bi bi-person-plus"></i>

                </div>


                <h1>Create Your Account</h1>


                <p>
                    Join Mero-Predict and explore NEPSE market insights.
                </p>

            </div>



            <!-- ================= FORM ================= -->

            <form
                method="POST"
                action="/register"
                id="registerForm"
            >


                <!-- Full Name -->

                <div class="form-field">

                    <label for="name">
                        Full Name
                    </label>


                    <div class="input-box">

                        <i class="bi bi-person"></i>


                        <input
                            type="text"
                            id="name"
                            name="name"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            required
                        >

                    </div>

                </div>



                <!-- Email -->

                <div class="form-field">

                    <label for="email">
                        Email Address
                    </label>


                    <div class="input-box">

                        <i class="bi bi-envelope"></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email address"
                            autocomplete="email"
                            required
                        >

                    </div>

                </div>



                <!-- Password -->

                <div class="form-field">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-box">

                        <i class="bi bi-lock"></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('password', 'passwordIcon')"
                        >

                            <i
                                class="bi bi-eye"
                                id="passwordIcon"
                            ></i>

                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="form-field">

                    <label for="confirm_password">
                        Confirm Password
                    </label>


                    <div class="input-box">

                        <i class="bi bi-shield-lock"></i>


                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm your password"
                            minlength="6"
                            autocomplete="new-password"
                            required
                        >


                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword('confirm_password', 'confirmIcon')"
                        >

                            <i
                                class="bi bi-eye"
                                id="confirmIcon"
                            ></i>

                        </button>

                    </div>

                </div>



                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input
                            type="checkbox"
                            name="terms"
                            required
                        >


                        <span>

                            I agree to the
                            <a href="#">Terms & Conditions</a>

                        </span>

                    </label>

                </div>



                <!-- Create Account -->

                <button
                    type="submit"
                    class="register-button"
                >

                    <span>Create Account</span>

                    <i class="bi bi-arrow-right"></i>

                </button>


            </form>



            <!-- ================= LOGIN ================= -->

            <div class="login-link">

                <p>

                    Already have an account?

                    <a href="{{ url_for('login') }}">
                        Login
                    </a>

                </p>

            </div>


        </div>



        <!-- ================= BACK HOME ================= -->

        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >

            <i class="bi bi-arrow-left"></i>

            Back to Mero-Predict

        </a>


        <p class="register-footer">

            © 2026 Mero-Predict. All rights reserved.

        </p>


    </div>

</main>



<!-- ================= PASSWORD SCRIPT ================= -->

<script>

function togglePassword(inputId, iconId) {

    const password =
        document.getElementById(inputId);

    const icon =
        document.getElementById(iconId);


    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    }

    else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}

</script>


</body>

</html>
